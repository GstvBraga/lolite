name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release
      - run: gh release create ${{ github.ref_name }} target/release/lolite.exe --title "LoLite ${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
