[package]
name = "lolite"
version = "0.1.1"
edition = "2024"

[dependencies]
base64 = "0.23.1"
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts"] }
native-tls = "0.2.18"
serde_json = "1.0.151"
ureq = { version = "2.12", default-features = false, features = ["native-tls", "json"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
winresource = "0.1.31"
